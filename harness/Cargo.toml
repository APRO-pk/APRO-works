[workspace]

[package]
name = "apro-harness"
version = "0.0.0"
edition = "2021"
publish = false
description = "Verification harness: carries real aproCAD mass properties through the orchestration store into a real HexaDOF model import."

# Platform crates: the orchestration layer under test.
[dependencies]
apro-store = { path = "../crates/apro-store" }
apro-api = { path = "../crates/apro-api" }

# Producer: the real CAD application crates, and the bridge that publishes from them.
apro-document = { path = "../../aproCAD/crates/document" }
apro-massprops = { path = "../../aproCAD/crates/massprops" }
apro-kernel = { path = "../../aproCAD/crates/kernel" }
apro-cad-bridge = { path = "../../aproCAD/crates/bridge" }

# Consumer: the real flight-dynamics crates, and the bridge that imports into them.
hex-core = { path = "../../hexadof2/crates/hex-core" }
hex-model = { path = "../../hexadof2/crates/hex-model" }
hex-bridge = { path = "../../hexadof2/crates/hex-bridge" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[dev-dependencies]
tempfile = "3"
