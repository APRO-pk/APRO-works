      The window paints before the bundled stylesheet is parsed, so the first frame
      needs a colour or it flashes white. This duplicates --color-canvas in
      src/index.css because it must exist before that file loads; index.css stays the
      single source of truth for everything after first paint.
    -->
    <style>
      html { background: #08090b; }
    </style>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
