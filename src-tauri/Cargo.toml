[package]
name = "apro-works"
version = "0.3.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "apro_works_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# In-app updates. The updater can only replace an installation that it, or a build
# carrying it, put there — so it has to ship in the same release that introduces it, and
# every release after this one is a click rather than a download.
#
# The artifacts it installs are signed with a key whose public half is in
# `tauri.conf.json`. Losing the private key means never being able to update an already
# installed copy again.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

# The orchestration layer. Kept in separate crates so `lib.rs` stays install/launch only,
# and so the store can be extracted into its own process later without a rewrite.
apro-store = { path = "../crates/apro-store" }
apro-api = { path = "../crates/apro-api" }
apro-client.workspace = true

[features]
# Production builds.
#
# The `tauri` crate's build script computes `dev = !custom_protocol`. This app has a
# `devUrl`, so without this a release build still points at the dev server — on launch
# that is "localhost refused to connect", not a blank window. Declaring the feature is
# what lets the Tauri CLI and the release workflow turn production mode on explicitly.
custom-protocol = ["tauri/custom-protocol"]
