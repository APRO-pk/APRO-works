[workspace]
resolver = "2"
members = ["crates/*", "src-tauri"]
# The verification harness is its own workspace: it path-depends on the app repos,
# which must never become dependencies of the platform crates.
exclude = ["harness"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
apro-types = { path = "crates/apro-types" }
apro-store = { path = "crates/apro-store" }
apro-api = { path = "crates/apro-api" }
apro-client = { path = "crates/apro-client" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
sha2 = "0.10"
hex = "0.4"
bytes = "1"
dirs = "6"
rusqlite = { version = "0.37", features = ["bundled"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time", "sync"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
