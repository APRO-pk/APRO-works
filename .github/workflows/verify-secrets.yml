name: Verify signing secrets

# Answers "are the signing secrets right?" in about a minute, instead of twelve minutes
# into a release build with a message that sounds cryptographic but is really just
# "this string is not a key".
#
# The updater refuses a release it cannot verify, so the build *must* fail without a good
# secret — but it should fail early and say why. A path pasted into the key secret is the
# mistake this is built to catch, and it is an easy one to make: the instruction reads
# "the contents of C:\...\apro-works.key", and the path is right there in the sentence.
#
# Nothing here prints the secrets. Everything reported is derived — a length, a shape, a
# yes/no — plus the literal text "untrusted comment", which is a fixed part of the format
# and not secret material.

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Inspect the signing secrets
        shell: pwsh
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY is not set or is empty. Check the Secrets tab (not Variables), under Repository secrets."
          }
          if ([string]::IsNullOrWhiteSpace($env:PASSWORD)) {
            throw "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not set or is empty."
          }

          $key = $env:KEY.Trim()

          "key length        : $($key.Length)"
          "key lines         : $(($key -split "`r?`n").Count)   (1 expected)"
          "contains \ or :   : $($key.Contains('\') -or $key.Contains(':'))   (true means it is a PATH, not a key)"

          $isBase64 = $true
          try { [void][System.Convert]::FromBase64String($key) } catch { $isBase64 = $false }
          "valid base64      : $isBase64"

          if ($isBase64) {
            $decoded = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($key))
            $hasComment = $decoded.StartsWith("untrusted comment:")
            "decoded has header: $hasComment   ('untrusted comment:' expected)"
            if (-not $hasComment) {
              throw "The secret decoded, but is not a minisign secret key."
            }
          } elseif ($key.StartsWith("untrusted comment:")) {
            "raw key text      : looks like an unwrapped minisign key (also accepted)"
          } else {
            throw "The secret is neither base64 nor minisign key text. It is most likely the file path."
          }

          if ($key.Contains('\') -or $key.Contains(':')) {
            throw "The secret looks like a file path. It must be the CONTENTS of the key file: Get-Content `"$env:USERPROFILE\.tauri\apro-works.key`" -Raw | Set-Clipboard"
          }

          "shapes look right"

      # The decisive test. Everything above is shape-checking; this actually signs, which
      # is the only thing that proves the password matches the key.
      - name: Prove the key and password can sign
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $probe = Join-Path $env:RUNNER_TEMP "signing-probe.bin"
          [System.IO.File]::WriteAllBytes($probe, [byte[]](1..64))

          npm run tauri -- signer sign "$probe"

          if (-not (Test-Path "$probe.sig")) {
            throw "The signer reported success but produced no signature."
          }
          "signature produced: yes"
          Remove-Item $probe, "$probe.sig" -Force
