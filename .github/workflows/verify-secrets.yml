name: Verify signing secrets

# Answers "are the signing secrets right?" in about a minute, instead of twelve minutes
# into a release build with a message that sounds cryptographic but is really just
# "this string is not a key".
#
# The updater refuses a release it cannot verify, so the build *must* fail without a good
# secret - but it should fail early and say why. A path pasted into the key secret is the
# mistake this is built to catch, and it is an easy one to make: the instruction reads
# "the contents of C:\...\apro-works.key", and the path is right there in the sentence.
#
# Each assertion is its own step, deliberately. When one fails, the *name of the failing
# step* is the diagnosis, so the answer is readable from the check-run API without opening
# a log.
#
# Nothing here prints the secrets. Everything reported is derived - a length, a shape, a
# yes/no - plus the literal text "untrusted comment", which is a fixed part of the format
# and not secret material.

on:
  workflow_dispatch:
  push:
    branches: [main]

# Lets the report step publish a one-line summary as a commit status, which - unlike the
# job log - can be read without a token. Only lengths and booleans are published, never
# any part of the secrets themselves.
permissions:
  statuses: write

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # Informational, asserts nothing, so the numbers are on screen even when an
      # assertion below stops the job.
      - name: Report what the secrets look like
        shell: pwsh
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $key = "$env:KEY".Trim()
          $password = "$env:PASSWORD".Trim()
          "key length        : $($key.Length)"
          "key lines         : $(($key -split "`r?`n").Count)   (1 expected)"
          "contains path sep : $($key.Contains('\') -or $key.Contains(':'))"
          $isBase64 = $true
          try { [void][System.Convert]::FromBase64String($key) } catch { $isBase64 = $false }
          "valid base64      : $isBase64"
          $header = "n/a"
          if ($isBase64 -and $key.Length -gt 0) {
            $decoded = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($key))
            $header = if ($decoded.StartsWith('untrusted comment:')) { "ok" } else { "other" }
            "decoded header    : $header   ('ok' expected)"
          }
          "password length   : $($password.Length)"

          # A commit status is readable without a token, unlike the job log. Lengths and
          # booleans only - nothing here reveals any part of a secret.
          $desc = "keylen=$($key.Length) lines=$(($key -split "`r?`n").Count) b64=$isBase64 hdr=$header pwlen=$($password.Length)"
          $body = @{ state = 'success'; context = 'secret-shape'; description = $desc } | ConvertTo-Json
          try {
            Invoke-RestMethod -Method Post -ContentType 'application/json' -Body $body `
              -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" `
              -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' } | Out-Null
            "published         : $desc"
          } catch { "status publish failed: $($_.Exception.Message)" }

      - name: "Assert: the key secret is present"
        shell: pwsh
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:KEY)) {
            "TAURI_SIGNING_PRIVATE_KEY is empty. Check the Secrets tab (not Variables), under Repository secrets."
            exit 1
          }
          "present."

      - name: "Assert: the key secret is not a file path"
        shell: pwsh
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $key = "$env:KEY".Trim()
          if ($key.Contains('\') -or $key.Contains(':')) {
            "The secret contains a path separator. It must be the CONTENTS of the key file:"
            "  Get-Content `"`$env:USERPROFILE\.tauri\apro-works.key`" -Raw | Set-Clipboard"
            exit 1
          }
          "not a path."

      - name: "Assert: the key is minisign text, or base64 of it"
        shell: pwsh
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $key = "$env:KEY".Trim()
          "length seen by this step: $($key.Length)"
          if ($key.StartsWith("untrusted comment:")) {
            "unwrapped minisign text - accepted."
            exit 0
          }
          try {
            $decoded = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($key))
          } catch {
            "The secret is neither minisign text nor valid base64."
            "error: $($_.Exception.Message)"
            exit 1
          }
          if (-not $decoded.StartsWith("untrusted comment:")) {
            "The secret is base64, but it does not decode to a minisign secret key."
            exit 1
          }
          "base64 of a minisign secret key - accepted."

      - name: "Assert: the password matches the key"
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $probe = Join-Path $env:RUNNER_TEMP "signing-probe.bin"
          [System.IO.File]::WriteAllBytes($probe, [byte[]](1..64))
          npm run tauri -- signer sign "$probe"
          if (-not (Test-Path "$probe.sig")) { "The signer produced no signature."; exit 1 }
          "signature produced."

      - name: "Passed: the secrets sign correctly"
        run: echo "Both secrets are present, well formed, and the key and password match."
