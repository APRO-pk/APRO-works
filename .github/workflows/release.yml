name: Release

# Publishing a tag builds the hub and attaches installers to a GitHub Release.
#
# That release is not just an artefact: it is what the app's own update check reads.
# `check_for_update` asks GitHub for `releases/latest` and compares the tag against the
# version the running build reports, so a tag that does not produce a release is
# invisible to every installed copy.
#
# `workflow_dispatch` builds and uploads a run artifact instead of releasing, so the
# pipeline can be proved without cutting a version.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Caches the cargo registry and target/ between runs. A cold Tauri release build
      # is slow; this is what keeps repeat releases quick.
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Free disk space
        shell: pwsh
        run: |
          # A release build of this workspace is large — it links SQLite, the store, the
          # API and the frontend. Windows runners start with limited free space on C:,
          # and exhausting it fails the link step in ways that look like unrelated
          # errors.
          Remove-Item -Recurse -Force "$env:ProgramFiles\Android", "$env:ProgramFiles\Microsoft SDKs\Azure" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$env:ProgramFiles (x86)\Android" -ErrorAction SilentlyContinue
          Get-PSDrive C | Select-Object @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}

      - name: Install frontend dependencies
        run: npm ci

      # The same checks that gate a local change. A release should not be the first
      # time the workflow rules or the token layer are exercised.
      - name: Verify
        run: |
          npm run verify:tokens
          npm run verify:workflow

      - name: Test the Rust workspace
        run: cargo test --workspace --locked

      # `npm run tauri build` rather than a bare `cargo build`: it runs
      # `beforeBuildCommand` (which produces `dist/`) and passes the `custom-protocol`
      # feature, so the binary loads the bundled frontend instead of pointing at the
      # dev server. Without that a release build shows "localhost refused to connect".
      # The Supabase credentials are inlined into the bundle at build time, so they must
      # be present *here* — supplying them later is impossible. Without them the build
      # still succeeds and then the app fails to mount, which previously meant a window
      # that was never revealed and an installer that looked fine.
      #
      # Repo variables rather than secrets: a publishable key is designed to ship inside
      # the client, so hiding it buys nothing and only makes the failure harder to see.
      # Set them under Settings -> Secrets and variables -> Actions -> Variables.
      - name: Build the hub
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run tauri build

      - name: Locate the build output
        id: target
        shell: pwsh
        run: |
          # The Cargo workspace root is the repository root, so cargo's `target/` sits
          # beside `src-tauri/`, not inside it. Asking cargo instead of hardcoding
          # means this cannot drift if the workspace layout changes.
          $target = (cargo metadata --format-version 1 --no-deps | ConvertFrom-Json).target_directory
          if (-not (Test-Path $target)) { throw "cargo reported a target directory that does not exist: $target" }
          "dir=$target" >> $env:GITHUB_OUTPUT
          "target directory: $target"

      - name: Stage the release assets
        shell: pwsh
        run: |
          $target = "${{ steps.target.outputs.dir }}"
          $release = Join-Path $target "release"

          # A zip that runs from anywhere, alongside the installers. Some sites cannot
          # run an installer, and it also makes the release useful to anyone who just
          # wants to look at the app.
          $stage = "dist/APRO-Works-Windows"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item (Join-Path $release "apro-works.exe") $stage
          Compress-Archive -Path $stage -DestinationPath "apro-works-win64.zip" -Force

          # Renamed without spaces so the download URLs are usable as-is.
          $bundle = Join-Path $release "bundle"
          if (-not (Test-Path $bundle)) { throw "No bundle directory at $bundle. The build did not produce installers." }

          $setup = Get-ChildItem (Join-Path $bundle "nsis") -Filter *.exe -File | Select-Object -First 1
          if ($setup) { Copy-Item $setup.FullName "apro-works-setup.exe" }
          $msi = Get-ChildItem (Join-Path $bundle "msi") -Filter *.msi -File | Select-Object -First 1
          if ($msi) { Copy-Item $msi.FullName "apro-works.msi" }

          if (-not $setup -and -not $msi) { throw "The build produced neither an NSIS installer nor an MSI." }

          Get-Item apro-works-win64.zip, apro-works-setup.exe, apro-works.msi -ErrorAction SilentlyContinue |
            Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Upload build artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: apro-works-win64
          path: |
            apro-works-win64.zip
            apro-works-setup.exe
            apro-works.msi
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apro-works-win64.zip
            apro-works-setup.exe
            apro-works.msi
          generate_release_notes: true
          fail_on_unmatched_files: true
